const byName = new Set(nodes);
const ns='http://www.w3.org/2000/svg';
const svg=document.getElementById('graph');
const $=id=>document.getElementById(id);
function sv(tag,attrs,text){const a=document.createElementNS(ns,tag);Object.entries(attrs||{}).forEach(([k,v])=>a.setAttribute(k,v));if(text!==undefined)a.textContent=text;return a;}
function chosen(){return {r:$('relation').value, s:$('source').value};}
function matches(e,c){return (!c.r||e.relation===c.r)&&(!c.s||e.source===c.s);}
function drawEdge(x1,y1,x2,y2,dir,rel){
 const l=sv('line',{class:'edge',x1,y1,x2,y2,'marker-end':'url(#arrow)'});svg.append(l);
 const lx=dir==='in'?430:680;let ly=y1+(y2-y1)*.55-3;
 svg.append(sv('text',{class:'edgetext',x:lx,y:ly,'text-anchor':'middle'},rel));
}
function node(x,y,label,kind){
 const g=sv('g',{class:'node'});g.style.cursor='pointer';
 const shown=Array.from(label).length>13 ? Array.from(label).slice(0,12).join('')+'…':label;
 const width=Math.min(245,Math.max(92,shown.length*14+26));
 const fill=kind==='center'?'#d9e7df':kind==='in'?'#e3edf1':'#f3e9dd';
 const stroke=kind==='center'?'#577669':kind==='in'?'#89a5b6':'#bd9b77';
 g.append(sv('rect',{x:x-width/2,y:y-20,width,height:40,rx:8,fill,stroke,'stroke-width':1.4}));
 g.append(sv('text',{x,y:y+5,'text-anchor':'middle',fill:'#28302e'},shown));
 const t=sv('title',{},label);g.append(t);g.addEventListener('click',()=>focus(label));svg.append(g);
}
function focus(n){

 for(let i=0;i<shownOut.length;i++){let y=positions(shownOut)[i];drawEdge(605,350,785,y,'out',shownOut[i].relation);}
 shownIn.forEach((e,i)=>node(190,positions(shownIn)[i],e.subject,'in'));

 node(550,350,n,'center');
 if(ins.length>cap)svg.append(sv('text',{x:190,y:662,'text-anchor':'middle',fill:'#777','font-size':12},`另有 ${ins.length-cap} 条入边请查看右侧列表`));
 if(outs.length>cap)svg.append(sv('text',{x:910,y:662,'text-anchor':'middle',fill:'#777','font-size':12},`另有 ${outs.length-cap} 条出边请查看右侧列表`));

  const meta=document.createElement('span');meta.className='meta';meta.textContent=`来源：${e.source} · PDF 第 ${e.page} 页`;

 });
}
